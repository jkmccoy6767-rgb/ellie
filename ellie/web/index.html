<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ellie Equity Intelligence</title>
  <meta name="description" content="Monitors S&P 500 equities across multiple data sources with statistics, risk and forecast models." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232a78d6'/%3E%3Cpath d='M5 16l4-5 3 3 6-7' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    try { const t = localStorage.getItem("ellie-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="Ellie home">
      <span class="brand-mark"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 4 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Ellie
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#/overview" data-route="overview">Market</a>
      <a href="#/screener" data-route="screener">Screener</a>
      <a href="#/sectors" data-route="sectors">Sectors</a>
      <a href="#/risk" data-route="risk">Risk</a>
      <a href="#/macro" data-route="macro">Macro</a>
      <a href="#/quality" data-route="quality">Data quality</a>
    </nav>
    <div class="topbar-right">
      <div class="search">
        <input id="search" type="search" placeholder="Search ticker or name" autocomplete="off" aria-label="Search stocks" />
        <div class="search-results" id="search-results" role="listbox"></div>
      </div>
      <span class="asof" id="asof"></span>
      <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="app"><div class="loading">Loading</div></main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
